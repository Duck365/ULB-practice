<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale: Last Breath Practice</title>
    <style>
        /* Base Reset & Styling */
        @font-face {
            font-family: 'Udtale';
            /* If you have a specific Undertale font file, link it here. Using monospace as fallback */
            src: local('Courier New'); 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-family: 'Udtale', 'Courier New', Courier, monospace; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* --- SCREEN CONTAINERS --- */
        .screen {
            display: none;
            width: 800px;
            height: 600px;
            position: relative;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .active {
            display: flex;
        }

        /* --- MENU SCREEN --- */
        #menu-screen h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 50px;
        }
        
        .title-red { color: #ff0000; }
        .title-white { color: #ffffff; }

        .start-btn {
            border: 2px solid white;
            padding: 10px 40px;
            color: #ffff00;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        /* --- CONTROLS SCREEN --- */
        #controls-screen {
            text-align: center;
            line-height: 2.5;
        }

        #controls-screen h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .controls-text {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .controls-subtext {
            font-size: 1rem;
            color: #888;
            margin-top: 40px;
        }

        /* --- BATTLE SCREEN --- */
        #battle-screen {
            justify-content: flex-end;
            padding-bottom: 30px;
            box-sizing: border-box;
        }

        .dialogue-box {
            width: 90%;
            height: 150px;
            border: 4px solid white;
            margin-bottom: 20px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.5rem;
            display: flex;
            align-items: flex-start;
        }

        .stats-row {
            width: 90%;
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            gap: 20px;
        }

        .hp-bar-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hp-label { color: white; }
        .hp-bar-bg {
            width: 60px;
            height: 20px;
            background-color: #ff0000;
            position: relative;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background-color: #ffff00;
            position: absolute;
            top: 0;
            left: 0;
        }

        .action-buttons {
            width: 90%;
            display: flex;
            justify-content: space-between;
        }

        .btn-action {
            border: 3px solid #ff9900;
            color: #ff9900;
            padding: 10px 0;
            width: 22%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .btn-action.active-btn {
            color: #ffff00;
            border-color: #ffff00;
        }

    </style>
</head>
<body>

    <!-- SCREEN 1: MAIN MENU -->
    <div id="menu-screen" class="screen active">
        <h1><span class="title-red">UNDERTALE: LAST BREATH</span> <span class="title-white">PRACTICE</span></h1>
        <div class="start-btn">START</div>
    </div>

    <!-- SCREEN 2: CONTROLS -->
    <div id="controls-screen" class="screen">
        <h2>CONTROLS</h2>
        <div class="controls-text">ARROW KEYS = MOVE / NAVIGATE</div>
        <div class="controls-text">Z / ENTER = SELECT</div>
        <div class="controls-text">X / SHIFT = DESELECT / BACK</div>
        <div class="controls-subtext">(Press X or SHIFT to return)</div>
    </div>

    <!-- SCREEN 3: BATTLE UI -->
    <div id="battle-screen" class="screen">
        
        <div class="dialogue-box">
            * Smells like a 90 degree angle.
        </div>

        <div class="stats-row">
            <div>PLAYER &nbsp;&nbsp; LV 19</div>
            <div class="hp-bar-container">
                <span class="hp-label">HP</span>
                <div class="hp-bar-bg">
                    <div class="hp-bar-fill"></div>
                </div>
                <span>92 / 92</span>
            </div>
        </div>

        <div class="action-buttons">
            <div class="btn-action active-btn">FIGHT</div>
            <div class="btn-action">ACT</div>
            <div class="btn-action">ITEM</div>
            <div class="btn-action">MERCY</div>
        </div>

    </div>

    <script>
        // Basic screen routing to test the flow
        const menuScreen = document.getElementById('menu-screen');
        const controlsScreen = document.getElementById('controls-screen');
        const battleScreen = document.getElementById('battle-screen');

        let currentScreen = 'menu';

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (currentScreen === 'menu') {
                if (key === 'z' || key === 'enter') {
                    // Move to controls when they select start
                    menuScreen.classList.remove('active');
                    controlsScreen.classList.add('active');
                    currentScreen = 'controls';
                }
            } 
            else if (currentScreen === 'controls') {
                if (key === 'x' || key === 'shift') {
                    // Back to menu
                    controlsScreen.classList.remove('active');
                    menuScreen.classList.add('active');
                    currentScreen = 'menu';
                } else if (key === 'z' || key === 'enter') {
                    // Proceed to battle
                    controlsScreen.classList.remove('active');
                    battleScreen.classList.add('active');
                    currentScreen = 'battle';
                }
            }
        });
    </script>
</body>
</html>
